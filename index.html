<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>FieldSnap — Báo cáo & Tra cứu hiện trường</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#1a73e8">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="FieldSnap">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: system-ui, sans-serif; background: #f1f3f4; min-height: 100vh;
         display: flex; justify-content: center; padding: 12px; }
  .card { background: #fff; border-radius: 16px; padding: 20px; max-width: 460px; width: 100%;
          box-shadow: 0 2px 12px rgba(0,0,0,.08); height: fit-content; }
  h1 { font-size: 20px; color: #1a73e8; }
  .sub { color: #666; font-size: 13px; margin-bottom: 14px; }
  label { font-size: 13px; font-weight: 600; color: #444; display: block; margin: 12px 0 4px; }
  input[type=text], textarea, select { width: 100%; padding: 10px; border: 1px solid #ccc;
          border-radius: 8px; font-size: 15px; font-family: inherit; background: #fff; }
  .btn { width: 100%; padding: 14px; border: none; border-radius: 10px; font-size: 16px;
         font-weight: 600; cursor: pointer; margin-top: 14px; }
  .btn-camera { background: #1a73e8; color: #fff; }
  .btn-send { background: #188038; color: #fff; }
  .btn:disabled { background: #ccc; cursor: not-allowed; }
  #status { margin-top: 14px; padding: 12px; border-radius: 8px; font-size: 14px; display: none; }
  .ok  { background: #e6f4ea; color: #188038; display: block !important; }
  .err { background: #fce8e6; color: #c5221f; display: block !important; }
  .info{ background: #e8f0fe; color: #1a73e8; display: block !important; }
  .warn{ background: #fce8e6; color: #c5221f; padding: 8px; border-radius: 8px; margin-top: 6px; }

  /* Tab bar */
  .tabbar { display: flex; gap: 6px; margin-bottom: 8px; }
  .tab { flex: 1; padding: 12px; border: none; border-radius: 10px; font-size: 15px;
         font-weight: 700; cursor: pointer; background: #eceff1; color: #555; }
  .tab.active { background: #1a73e8; color: #fff; }

  /* Thumbnail dải ảnh đã chụp */
  #thumbs { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; }
  .thumb { position: relative; width: 70px; height: 70px; border-radius: 10px; overflow: hidden;
           border: 2px solid #1a73e8; }
  .thumb img { width: 100%; height: 100%; object-fit: cover; }
  .thumb .del { position: absolute; top: 2px; right: 2px; width: 22px; height: 22px;
                border-radius: 50%; border: none; background: rgba(0,0,0,.65); color: #fff;
                font-size: 13px; line-height: 22px; cursor: pointer; padding: 0; }

  /* Camera toàn màn hình */
  #camOverlay { position: fixed; inset: 0; height: 100dvh; background: #000; z-index: 9999;
                display: none; flex-direction: column; }
  #camOverlay.show { display: flex; }
  #camVideo { flex: 1; width: 100%; min-height: 0; object-fit: cover; }
  #camBar { display: flex; align-items: center; justify-content: space-around;
            padding: 16px 16px calc(20px + env(safe-area-inset-bottom, 12px));
            background: rgba(0,0,0,.9); flex-shrink: 0; }
  #snapBtn { width: 76px; height: 76px; border-radius: 50%; border: 5px solid #fff;
             background: #1a73e8; color: #fff; font-size: 28px; cursor: pointer; flex-shrink: 0; }
  #snapBtn:active { transform: scale(.92); }
  #doneBtn { background: #188038; color: #fff; border: none; border-radius: 10px;
             padding: 14px 20px; font-size: 16px; font-weight: 600; cursor: pointer; flex-shrink: 0; }
  #camCount { color: #fff; font-size: 17px; font-weight: 700; min-width: 60px; text-align: center; }
  #camClose { position: absolute; top: calc(10px + env(safe-area-inset-top, 0px)); right: 14px;
              width: 40px; height: 40px; border-radius: 50%; border: none;
              background: rgba(0,0,0,.6); color: #fff; font-size: 20px; cursor: pointer; z-index: 2; }
  #flash { position: absolute; inset: 0; background: #fff; opacity: 0; pointer-events: none;
           transition: opacity .12s; }

  /* Modal chọn thư mục */
  .modal-bg { position: fixed; inset: 0; background: rgba(0,0,0,.5); z-index: 9998;
              display: none; align-items: center; justify-content: center; padding: 16px; }
  .modal-bg.show { display: flex; }
  .modal { background: #fff; border-radius: 14px; padding: 18px; width: 100%; max-width: 420px;
           max-height: 82vh; overflow: auto; }
  .modal h3 { font-size: 17px; margin-bottom: 10px; }
  .folder-item { padding: 12px; border: 1px solid #ddd; border-radius: 8px; margin-top: 8px; cursor: pointer; }
  .folder-item:active { background: #e8f0fe; }
  .folder-item .fp { font-size: 12px; color: #888; margin-top: 2px; }

  /* Gallery tra cứu */
  #browseResults { margin-top: 12px; }
  .report { border: 1px solid #e0e0e0; border-radius: 12px; padding: 12px; margin-top: 12px; }
  .report .meta { font-size: 13px; color: #555; }
  .report .title { font-weight: 700; font-size: 15px; margin-bottom: 2px; }
  .report .desc { font-size: 13px; color: #333; margin-top: 6px; }
  .report .imgs { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 8px; }
  .report .imgs a { width: 72px; height: 72px; border-radius: 8px; overflow: hidden; display: block; background: #eee; }
  .report .imgs img { width: 100%; height: 100%; object-fit: cover; }
  .chip { display: inline-block; background: #e8f0fe; color: #1a73e8; border-radius: 6px;
          padding: 1px 7px; font-size: 12px; font-weight: 600; margin-right: 4px; }
</style>
</head>
<body>
<div class="card">
  <div class="tabbar">
    <button id="tabBtnCapture" class="tab active" onclick="showTab('capture')">📸 Chụp</button>
    <button id="tabBtnBrowse" class="tab" onclick="showTab('browse')">🔍 Tra cứu</button>
    <button id="tabBtnManage" class="tab" onclick="showTab('manage')">📊 Quản lý</button>
  </div>
  <div id="whoami" style="font-size:12px;color:#888;margin-bottom:6px"></div>

  <!-- ========== CHẾ ĐỘ CHỤP ========== -->
  <div id="secCapture">
    <p class="sub">Chụp nhiều ảnh → AI phân tích nền → lưu Google Sheet</p>

    <label>Tên của bạn</label>
    <input type="text" id="user" placeholder="VD: Thế Mỹ">

    <label>Dự án
      <a id="setFolder" style="float:right;color:#188038;font-weight:600;text-decoration:none;cursor:pointer">📁 Thư mục</a>
      <a id="addProj" style="float:right;color:#1a73e8;font-weight:600;text-decoration:none;cursor:pointer;margin-right:14px">➕ Thêm</a>
    </label>
    <select id="project"></select>

    <label>Hạng mục <a id="addCat" style="float:right;color:#1a73e8;font-weight:600;text-decoration:none;cursor:pointer">➕ Thêm</a></label>
    <select id="category"><option value="">— AI tự phân loại —</option></select>

    <div id="componentFields" style="display:none">
      <label>Thông tin cấu kiện (đóng dấu lên ảnh — dự án Cầu ống lồng)</label>
      <input type="text" id="model" placeholder="Model (VD: A3-404-LB)">
      <input type="text" id="gate" placeholder="Cổng / Gate (VD: #21L2)" style="margin-top:8px">
      <input type="text" id="unit" placeholder="Cấu kiện (VD: Unit 64 - Rotunda)" style="margin-top:8px">
    </div>

    <input type="file" id="fileInput" accept="image/*" capture="environment" hidden>
    <button class="btn btn-camera" onclick="openCamera()">📸 MỞ CAMERA — CHỤP LIÊN TỤC</button>

    <div id="thumbs"></div>

    <label>Ghi chú (tùy chọn — AI sẽ tự mô tả ảnh)</label>
    <textarea id="note" rows="2" placeholder="VD: Đã hàn xong dầm trục B"></textarea>

    <button class="btn btn-send" id="sendBtn" onclick="send()" disabled>☁️ GỬI BÁO CÁO</button>
    <div id="status"></div>
  </div>

  <!-- ========== CHẾ ĐỘ QUẢN LÝ (cho sếp) ========== -->
  <div id="secManage" style="display:none">
    <p class="sub">Theo dõi nhân viên QC: ai chụp, dự án nào, bao nhiêu báo cáo</p>
    <div class="tabbar" style="margin-bottom:10px">
      <button class="tab active" id="mfToday" onclick="setMfRange('today')">Hôm nay</button>
      <button class="tab" id="mf7" onclick="setMfRange('7')">7 ngày</button>
      <button class="tab" id="mfAll" onclick="setMfRange('all')">Tất cả</button>
    </div>
    <div id="manageBody" style="font-size:14px;color:#888">⏳ Đang tải...</div>

    <label style="margin-top:16px">🤖 Hỏi AI về dữ liệu</label>
    <input type="text" id="askInput" placeholder="VD: Hôm nay ai chụp nhiều nhất? PVF còn thiếu gì?" onkeydown="if(event.key==='Enter')askAI()">
    <button class="btn btn-camera" style="margin-top:8px" onclick="askAI()">Hỏi AI</button>
    <div id="askAnswer" style="margin-top:10px"></div>
  </div>

  <!-- ========== CHẾ ĐỘ TRA CỨU ========== -->
  <div id="secBrowse" style="display:none">
    <p class="sub">Xem lại & tìm ảnh đã chụp theo dự án</p>
    <label>Dự án</label>
    <select id="browseProject" onchange="loadReports()"></select>
    <label>Tìm kiếm (cấu kiện, người chụp, hạng mục, ghi chú...)</label>
    <input type="text" id="browseSearch" placeholder="Gõ để lọc..." oninput="renderReports()">
    <div id="browseInfo" style="font-size:13px;color:#888;margin-top:8px"></div>
    <div id="browseResults"></div>
  </div>
</div>

<!-- Modal nhập tên bắt buộc (lần đầu trên máy này) -->
<div id="nameModal" class="modal-bg">
  <div class="modal">
    <h3>👤 Nhập tên của bạn</h3>
    <p style="font-size:13px;color:#666;margin-bottom:10px">Máy này sẽ ghi nhớ tên — lần sau không cần nhập lại.</p>
    <input type="text" id="nameInput" placeholder="VD: Thế Mỹ" autocomplete="name">
    <button class="btn btn-send" style="margin-top:10px" onclick="saveNameGate()">Lưu & Bắt đầu</button>
  </div>
</div>

<!-- Modal chọn thư mục -->
<div id="folderModal" class="modal-bg">
  <div class="modal">
    <h3 id="fmTitle">Chọn thư mục lưu</h3>
    <input type="text" id="folderQuery" placeholder="Gõ tên thư mục cần tìm...">
    <button class="btn btn-camera" style="margin-top:8px" onclick="searchFolders()">🔍 Tìm thư mục</button>
    <div id="folderResults"></div>
    <button style="margin-top:12px;background:none;border:none;color:#666;cursor:pointer;font-size:15px" onclick="closeFolderModal()">Đóng</button>
  </div>
</div>

<!-- Camera -->
<div id="camOverlay">
  <button id="camClose" onclick="closeCamera()">✕</button>
  <video id="camVideo" autoplay playsinline muted></video>
  <div id="flash"></div>
  <div id="camBar">
    <span id="camCount">0 ảnh</span>
    <button id="snapBtn" onclick="snap()">📸</button>
    <button id="doneBtn" onclick="sendFromCamera()">GỬI ✓</button>
  </div>
</div>

<script>
// ====== CẤU HÌNH ======
const API_URL = 'https://script.google.com/macros/s/AKfycbw9Ht0t2ooozM7i6-GZbrB_bXmZmIjDAueD4wTu6byOiXojbuF66jLOYgB5obwQJZLh/exec';
const SECRET_KEY = 'FS-themy-2026-xK7mQ9pL';
const MAX_PHOTOS = 50;
// ======================

let photos = [];
let camStream = null;
let allReports = [];
const $ = id => document.getElementById(id);

// ===== TAB =====
function showTab(t) {
  $('secCapture').style.display = t === 'capture' ? 'block' : 'none';
  $('secBrowse').style.display = t === 'browse' ? 'block' : 'none';
  $('secManage').style.display = t === 'manage' ? 'block' : 'none';
  $('tabBtnCapture').classList.toggle('active', t === 'capture');
  $('tabBtnBrowse').classList.toggle('active', t === 'browse');
  $('tabBtnManage').classList.toggle('active', t === 'manage');
  if (t === 'browse' && allReports.length === 0) loadReports();
  if (t === 'manage') loadManage();
}

// ===== ID máy + Tên người (bắt buộc nhập lần đầu, nhớ theo máy) =====
if (!localStorage.getItem('deviceId'))
  localStorage.setItem('deviceId', 'dev-' + (crypto.randomUUID ? crypto.randomUUID() : Date.now()));
const DEVICE_ID = localStorage.getItem('deviceId');

function updateWhoami() {
  const n = localStorage.getItem('userName') || '';
  $('whoami').innerHTML = n
    ? '👤 ' + n + ' <a onclick="changeName()" style="color:#1a73e8;cursor:pointer;margin-left:6px">đổi tên</a>'
    : '';
}
function changeName() { $('nameInput').value = localStorage.getItem('userName') || ''; $('nameModal').classList.add('show'); }
function saveNameGate() {
  const n = ($('nameInput').value || '').trim();
  if (!n) { alert('Vui lòng nhập tên.'); return; }
  localStorage.setItem('userName', n);
  $('user').value = n;
  $('nameModal').classList.remove('show');
  updateWhoami();
}

$('user').value = localStorage.getItem('userName') || '';
$('user').addEventListener('input', e => { localStorage.setItem('userName', e.target.value); updateWhoami(); });
updateWhoami();
if (!localStorage.getItem('userName')) $('nameModal').classList.add('show');  // bắt buộc lần đầu

['model','gate','unit'].forEach(id => {
  $(id).value = localStorage.getItem('fs_' + id) || '';
  $(id).addEventListener('input', e => localStorage.setItem('fs_' + id, e.target.value));
});

// ===== Danh sách dự án + hạng mục riêng từng dự án =====
const ALL = '__all__';
let projConfigs = {};   // { tên dự án: { categories: [...] } }

function fillProjectSelects(projects) {
  const names = projects.map(p => p.name);
  projConfigs = {};
  projects.forEach(p => projConfigs[p.name] = { categories: p.categories || [] });
  const saved = localStorage.getItem('lastProject');
  const opts = names.map(n => '<option value="' + n.replace(/"/g,'&quot;') + '">' + n + '</option>').join('');
  $('project').innerHTML = opts || '<option value="">(Chưa có dự án — bấm ➕ Thêm)</option>';
  $('browseProject').innerHTML = '<option value="' + ALL + '">— Tất cả dự án —</option>' + opts;
  if (saved && names.includes(saved)) $('project').value = saved;
  fillCategories();
  toggleComponentFields();
}

function fillCategories() {
  const cfg = projConfigs[$('project').value];
  const cats = cfg ? cfg.categories : [];
  $('category').innerHTML = '<option value="">— AI tự phân loại —</option>' +
    cats.map(c => '<option value="' + c.replace(/"/g,'&quot;') + '">' + c + '</option>').join('');
}

post({ action: 'projectsFull' })
  .then(d => { if (d.ok) fillProjectSelects(d.projects || []); })
  .catch(() => {});

$('project').addEventListener('change', e => {
  localStorage.setItem('lastProject', e.target.value);
  fillCategories();
  toggleComponentFields();
});

// ➕ Thêm hạng mục cho dự án đang chọn
$('addCat').addEventListener('click', async () => {
  const pv = $('project').value;
  if (!pv) { alert('Hãy chọn/thêm dự án trước.'); return; }
  const cat = (prompt('Tên hạng mục mới cho dự án "' + pv + '":') || '').trim();
  if (!cat) return;
  try {
    const d = await post({ action: 'addCategory', project: pv, category: cat });
    if (!d.ok) throw new Error(d.error);
    projConfigs[pv] = { categories: d.categories };
    fillCategories();
    $('category').value = cat;
    alert('✅ Đã thêm hạng mục: ' + cat);
  } catch (e) { alert('❌ ' + e.message); }
});

function usesComponentInfo() { return /ống lồng/i.test($('project').value); }
function toggleComponentFields() {
  $('componentFields').style.display = usesComponentInfo() ? 'block' : 'none';
}

// ===== Thêm dự án =====
$('addProj').addEventListener('click', async () => {
  const name = (prompt('Tên dự án mới:') || '').trim();
  if (!name) return;
  try {
    const d = await post({ action: 'addProject', name });
    if (!d.ok) throw new Error(d.error);
    const full = await post({ action: 'projectsFull' });
    if (full.ok) fillProjectSelects(full.projects);
    $('project').value = name;
    localStorage.setItem('lastProject', name);
    fillCategories(); toggleComponentFields();
    alert('✅ Đã thêm dự án: ' + name);
  } catch (e) { alert('❌ ' + e.message); }
});

// ===== Chọn thư mục Drive (tìm + bấm) =====
let folderTargetProject = null;
$('setFolder').addEventListener('click', () => {
  const pv = $('project').value;
  if (!pv) { alert('Hãy chọn/thêm dự án trước.'); return; }
  folderTargetProject = pv;
  $('fmTitle').textContent = '📁 Thư mục lưu cho: ' + pv;
  $('folderQuery').value = '';
  $('folderResults').innerHTML = '<p style="color:#888;font-size:13px;margin-top:10px">Gõ tên thư mục rồi bấm Tìm.</p>';
  $('folderModal').classList.add('show');
  searchFolders();
});
function closeFolderModal() { $('folderModal').classList.remove('show'); }
async function searchFolders() {
  $('folderResults').innerHTML = '⏳ Đang tìm...';
  try {
    const d = await post({ action: 'searchFolders', query: $('folderQuery').value.trim() });
    if (!d.ok) throw new Error(d.error);
    if (!d.folders.length) { $('folderResults').innerHTML = '<p>Không tìm thấy thư mục nào.</p>'; return; }
    const esc = s => String(s).replace(/[<>&"]/g, c => ({'<':'&lt;','>':'&gt;','&':'&amp;','"':'&quot;'}[c]));
    $('folderResults').innerHTML = d.folders.map(f =>
      '<div class="folder-item" onclick="pickFolder(\'' + f.id + '\', this)"><b>📁 ' + esc(f.name) + '</b>' +
      (f.parent ? '<div class="fp">trong: ' + esc(f.parent) + '</div>' : '') + '</div>').join('');
  } catch (e) { $('folderResults').innerHTML = '❌ ' + e.message; }
}
async function pickFolder(id, el) {
  el.style.background = '#e6f4ea';
  try {
    const d = await post({ action: 'setProjectFolder', project: folderTargetProject, folder: id });
    if (!d.ok) throw new Error(d.error);
    closeFolderModal();
    alert('✅ Ảnh dự án "' + folderTargetProject + '" sẽ lưu vào:\n📁 ' + d.folderName + ' / <tháng> / <ngày>');
  } catch (e) { alert('❌ ' + e.message); }
}

// ===== CAMERA =====
async function openCamera() {
  if (!$('project').value) { alert('Hãy chọn/thêm dự án trước.'); return; }
  try {
    camStream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment', width: { ideal: 1920 } }, audio: false });
    $('camVideo').srcObject = camStream;
    $('camOverlay').classList.add('show');
    updateCamCount();
  } catch (e) { $('fileInput').click(); }
}
function snap() {
  if (photos.length >= MAX_PHOTOS) { alert('Tối đa ' + MAX_PHOTOS + ' ảnh/báo cáo'); return; }
  const video = $('camVideo');
  const vw = video.videoWidth, vh = video.videoHeight;
  const scale = Math.min(1, 1280 / Math.max(vw, vh));
  const w = Math.round(vw * scale), h = Math.round(vh * scale);
  const portrait = window.matchMedia('(orientation: portrait)').matches;
  const frameLandscape = w > h;
  const needRotate = portrait !== frameLandscape;
  let angle = 0; try { angle = (screen.orientation && screen.orientation.angle) || 0; } catch (e) {}
  const clockwise = (angle === 180 || angle === 270);
  const canvas = document.createElement('canvas');
  const ctx = canvas.getContext('2d');
  if (needRotate) {
    canvas.width = h; canvas.height = w;
    ctx.translate(canvas.width / 2, canvas.height / 2);
    ctx.rotate(clockwise ? Math.PI / 2 : -Math.PI / 2);
    ctx.drawImage(video, -w / 2, -h / 2, w, h);
  } else { canvas.width = w; canvas.height = h; ctx.drawImage(video, 0, 0, w, h); }
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  drawStamp(ctx, canvas.width, canvas.height);
  photos.push(canvas.toDataURL('image/jpeg', 0.85).split(',')[1]);
  $('flash').style.opacity = '0.7'; setTimeout(() => $('flash').style.opacity = '0', 120);
  if (navigator.vibrate) navigator.vibrate(40);
  updateCamCount(); renderThumbs();
}
function closeCamera() { if (camStream) { camStream.getTracks().forEach(t => t.stop()); camStream = null; } $('camOverlay').classList.remove('show'); }
function sendFromCamera() { if (photos.length === 0) { closeCamera(); return; } closeCamera(); send(); }
function updateCamCount() {
  $('camCount').textContent = photos.length + ' ảnh';
  $('sendBtn').disabled = photos.length === 0;
  $('sendBtn').textContent = photos.length ? '☁️ GỬI BÁO CÁO (' + photos.length + ' ảnh)' : '☁️ GỬI BÁO CÁO';
}
$('fileInput').addEventListener('change', async e => {
  const file = e.target.files[0]; if (!file) return;
  let img; try { img = await createImageBitmap(file, { imageOrientation: 'from-image' }); } catch (_) { img = await createImageBitmap(file); }
  const scale = Math.min(1, 1280 / Math.max(img.width, img.height));
  const canvas = document.createElement('canvas');
  canvas.width = img.width * scale; canvas.height = img.height * scale;
  const c = canvas.getContext('2d');
  c.drawImage(img, 0, 0, canvas.width, canvas.height);
  drawStamp(c, canvas.width, canvas.height);
  photos.push(canvas.toDataURL('image/jpeg', 0.85).split(',')[1]);
  e.target.value = ''; updateCamCount(); renderThumbs();
});
function renderThumbs() {
  $('thumbs').innerHTML = photos.map((b64, i) =>
    '<div class="thumb"><img src="data:image/jpeg;base64,' + b64 + '"><button class="del" onclick="removePhoto(' + i + ')">✕</button></div>').join('');
}
function removePhoto(i) { photos.splice(i, 1); updateCamCount(); renderThumbs(); }

// ===== ĐÓNG DẤU (không còn GPS) =====
function roundRect(ctx, x, y, w, h, r) {
  ctx.beginPath(); ctx.moveTo(x + r, y); ctx.arcTo(x + w, y, x + w, y + h, r);
  ctx.arcTo(x + w, y + h, x, y + h, r); ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath();
}
function drawStamp(ctx, W, H) {
  const now = new Date(), p = n => String(n).padStart(2, '0');
  const time = `${p(now.getDate())}/${p(now.getMonth() + 1)}/${now.getFullYear()} ${p(now.getHours())}:${p(now.getMinutes())}`;
  const proj = $('project').value || '';
  const useC = usesComponentInfo();
  const model = useC ? ($('model').value || '').trim() : '';
  const gate  = useC ? ($('gate').value || '').trim() : '';
  const unit  = useC ? ($('unit').value || '').trim() : '';
  const user  = ($('user').value || '').trim();
  const cat = $('category').value;
  const rows = [];
  if (proj) rows.push(['Dự án', proj]);
  if (cat) rows.push(['Hạng mục', cat]);
  if (model) rows.push(['Model', model]);
  if (gate)  rows.push(['Cổng', gate]);
  if (unit)  rows.push(['Cấu kiện', unit, true]);
  rows.push(['Thời gian', time + (user ? '  •  ' + user : '')]);

  const fs = Math.max(13, Math.round(W * 0.021));
  const lh = Math.round(fs * 1.35), titleLh = Math.round(fs * 1.55);
  const padX = Math.round(fs * 0.7), padY = Math.round(fs * 0.5);
  let maxW = 0;
  rows.forEach(r => { ctx.font = r[2] ? `bold ${Math.round(fs*1.2)}px Arial` : `${fs}px Arial`;
    maxW = Math.max(maxW, ctx.measureText(r[2] ? r[1] : (r[0]+': '+r[1])).width); });
  const cardW = Math.min(W - fs, maxW + padX * 2);
  let cardH = padY * 2; rows.forEach(r => cardH += r[2] ? titleLh : lh);
  const x = W - cardW - Math.round(fs * 0.5), y = H - cardH - Math.round(fs * 0.5);
  ctx.fillStyle = 'rgba(0,0,0,0.28)'; roundRect(ctx, x, y, cardW, cardH, Math.round(fs*0.35)); ctx.fill();
  ctx.textBaseline = 'top'; ctx.lineJoin = 'round';
  const dt = (txt, tx, ty, bold) => {
    ctx.font = `${bold?'bold ':''}${bold?Math.round(fs*1.2):fs}px Arial`;
    ctx.strokeStyle = 'rgba(0,0,0,0.85)'; ctx.lineWidth = Math.max(2, Math.round(fs*0.16)); ctx.strokeText(txt, tx, ty);
    ctx.fillStyle = '#fff'; ctx.fillText(txt, tx, ty);
  };
  let cy = y + padY;
  rows.forEach(r => { if (r[2]) { dt(r[1], x+padX, cy, true); cy += titleLh; }
    else { dt(r[0]+': '+r[1], x+padX, cy, false); cy += lh; } });
}

// ===== GỬI =====
async function send() {
  if (!$('project').value) { alert('Hãy chọn/thêm dự án trước.'); return; }
  const btn = $('sendBtn'), st = $('status');
  btn.disabled = true; st.className = 'info'; st.textContent = '⏳ Đang gửi ' + photos.length + ' ảnh...';
  try {
    const d = await post({
      reportId: crypto.randomUUID(), images: photos,
      note: $('note').value.trim(), user: $('user').value.trim(), deviceId: DEVICE_ID,
      project: $('project').value, category: $('category').value,
      model: usesComponentInfo() ? $('model').value.trim() : '',
      gate: usesComponentInfo() ? $('gate').value.trim() : '',
      unit: usesComponentInfo() ? $('unit').value.trim() : '',
      ocrText: '', entities: []
    });
    if (!d.ok) throw new Error(d.error);
    st.className = 'ok';
    let html = '✅ Đã lưu báo cáo (' + (d.photoCount || photos.length) + ' ảnh)!<br>📁 Dự án: <b>' + (d.project || '?') + '</b>';
    if (d.aiPending) html += '<br>🤖 AI đang phân tích nền — xem ở tab Tra cứu sau ~1 phút.';
    st.innerHTML = html;
    photos = []; $('note').value = ''; renderThumbs(); updateCamCount();
    allReports = []; // làm mới tra cứu lần sau
  } catch (e) { st.className = 'err'; st.textContent = '❌ Lỗi: ' + e.message; btn.disabled = false; }
}

// ===== TRA CỨU =====
async function loadReports() {
  $('browseResults').innerHTML = '';
  $('browseInfo').textContent = '⏳ Đang tải...';
  try {
    const d = await post({ action: 'listReports', project: $('browseProject').value });
    if (!d.ok) throw new Error(d.error);
    allReports = d.reports || [];
    renderReports();
  } catch (e) { $('browseInfo').textContent = '❌ ' + e.message; }
}
function thumbUrl(url) {
  const m = String(url).match(/[-\w]{25,}/);
  return m ? 'https://drive.google.com/thumbnail?id=' + m[0] + '&sz=w200' : '';
}
function fmtTime(t) {
  const d = new Date(t); if (isNaN(d)) return t;
  const p = n => String(n).padStart(2, '0');
  return `${p(d.getDate())}/${p(d.getMonth()+1)}/${d.getFullYear()} ${p(d.getHours())}:${p(d.getMinutes())}`;
}
function renderReports() {
  const q = $('browseSearch').value.trim().toLowerCase();
  const list = allReports.filter(r => !q ||
    [r.time, r.project, r.category, r.description, r.note, r.user, r.model, r.gate, r.unit]
    .join(' ').toLowerCase().includes(q));
  $('browseInfo').textContent = list.length + ' báo cáo' + (q ? ' (lọc)' : '');
  const esc = s => String(s||'').replace(/[<>&]/g, c => ({'<':'&lt;','>':'&gt;','&':'&amp;'}[c]));
  $('browseResults').innerHTML = list.map(r => {
    const title = r.unit || r.category || '(chưa phân loại)';
    const tags = [r.model, r.gate].filter(Boolean).map(t => '<span class="chip">' + esc(t) + '</span>').join('');
    const imgs = (r.images || []).map(u =>
      '<a href="' + u + '" target="_blank"><img loading="lazy" src="' + thumbUrl(u) + '"></a>').join('');
    return '<div class="report">' +
      '<div class="title">' + esc(title) + '</div>' +
      '<div class="meta">🕒 ' + esc(fmtTime(r.time)) + (r.user ? ' • 👤 ' + esc(r.user) : '') +
        ' • 📁 ' + esc(r.project) + '</div>' +
      (tags ? '<div style="margin-top:4px">' + tags + (r.category ? '<span class="chip" style="background:#fff3e0;color:#e65100">' + esc(r.category) + '</span>' : '') + '</div>' : '') +
      (r.description ? '<div class="desc">🤖 ' + esc(r.description) + '</div>' : '') +
      (r.issues ? '<div class="warn">⚠️ ' + esc(r.issues).replace(/\n/g,'<br>') + '</div>' : '') +
      (r.note ? '<div class="desc">📝 ' + esc(r.note) + '</div>' : '') +
      (imgs ? '<div class="imgs">' + imgs + '</div>' : '') +
    '</div>';
  }).join('') || '<p style="margin-top:12px;color:#888">Chưa có báo cáo nào.</p>';
}

// ===== QUẢN LÝ (cho sếp) =====
let manageReports = [], mfRange = 'today';
async function loadManage() {
  $('manageBody').innerHTML = '⏳ Đang tải...';
  try {
    const d = await post({ action: 'listReports', project: '__all__' });
    if (!d.ok) throw new Error(d.error);
    manageReports = d.reports || [];
    renderManage();
  } catch (e) { $('manageBody').innerHTML = '❌ ' + e.message; }
}
function setMfRange(r) {
  mfRange = r;
  ['mfToday','mf7','mfAll'].forEach(id => $(id).classList.remove('active'));
  $(r === 'today' ? 'mfToday' : r === '7' ? 'mf7' : 'mfAll').classList.add('active');
  renderManage();
}
function inRange(t) {
  const d = new Date(t); if (isNaN(d)) return true;
  if (mfRange === 'all') return true;
  const now = new Date();
  if (mfRange === 'today') return d.toDateString() === now.toDateString();
  return (now - d) <= 7 * 86400000;
}
function renderManage() {
  const esc = s => String(s||'').replace(/[<>&]/g, c => ({'<':'&lt;','>':'&gt;','&':'&amp;'}[c]));
  const list = manageReports.filter(r => inRange(r.time));
  const byUser = {}, byProj = {};
  list.forEach(r => {
    const u = (r.user || '(không tên)');
    if (!byUser[u]) byUser[u] = { count: 0, projects: {}, last: '' };
    byUser[u].count++; byUser[u].projects[r.project] = 1;
    if (r.time > byUser[u].last) byUser[u].last = r.time;
    const p = (r.project || '(chưa rõ)');
    if (!byProj[p]) byProj[p] = { count: 0, users: {} };
    byProj[p].count++; byProj[p].users[r.user || '(không tên)'] = 1;
  });
  const nUsers = Object.keys(byUser).length, nProj = Object.keys(byProj).length;

  let html = '<div style="display:flex;gap:8px;text-align:center;margin-bottom:12px">' +
    kpi(list.length, 'báo cáo') + kpi(nUsers, 'người chụp') + kpi(nProj, 'dự án') + '</div>';

  html += '<h3 style="font-size:15px;margin:10px 0 4px">👤 Theo nhân viên</h3>';
  const users = Object.entries(byUser).sort((a,b) => b[1].count - a[1].count);
  html += users.length ? users.map(([u, v]) =>
    '<div class="report" style="padding:10px"><b>' + esc(u) + '</b> — <b style="color:#1a73e8">' + v.count + '</b> báo cáo' +
    '<div class="meta">📁 ' + Object.keys(v.projects).map(esc).join(', ') + '</div>' +
    '<div class="meta">🕒 gần nhất: ' + esc(fmtTime(v.last)) + '</div></div>').join('')
    : '<p style="color:#888">Không có dữ liệu trong kỳ.</p>';

  html += '<h3 style="font-size:15px;margin:14px 0 4px">📁 Theo dự án</h3>';
  const projs = Object.entries(byProj).sort((a,b) => b[1].count - a[1].count);
  html += projs.map(([p, v]) =>
    '<div class="report" style="padding:10px"><b>' + esc(p) + '</b> — <b style="color:#188038">' + v.count + '</b> báo cáo' +
    '<div class="meta">👥 ' + Object.keys(v.users).map(esc).join(', ') + '</div></div>').join('');

  $('manageBody').innerHTML = html;
}
function kpi(n, label) {
  return '<div style="flex:1;background:#e8f0fe;border-radius:10px;padding:10px">' +
    '<div style="font-size:22px;font-weight:700;color:#1a73e8">' + n + '</div>' +
    '<div style="font-size:12px;color:#555">' + label + '</div></div>';
}

async function askAI() {
  const q = $('askInput').value.trim();
  if (!q) return;
  $('askAnswer').className = 'info'; $('askAnswer').style.display = 'block';
  $('askAnswer').textContent = '🤖 Đang suy nghĩ...';
  try {
    const d = await post({ action: 'ask', question: q });
    if (!d.ok) throw new Error(d.error);
    $('askAnswer').className = 'ok';
    $('askAnswer').innerHTML = '🤖 ' + String(d.answer || '').replace(/\n/g, '<br>');
  } catch (e) { $('askAnswer').className = 'err'; $('askAnswer').textContent = '❌ ' + e.message; }
}

// ===== Helper POST =====
async function post(body) {
  const res = await fetch(API_URL, { method: 'POST', headers: { 'Content-Type': 'text/plain' },
    body: JSON.stringify(Object.assign({ key: SECRET_KEY }, body)) });
  return res.json();
}
